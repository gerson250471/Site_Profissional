# Este arquivo deve ser salvo em: .github/workflows/deploy.yml
# Ele automatiza o deploy do site na Hostinger e do script no Google

name: Deploy Fullstack (Hostinger + Google)

on:
  push:
    branches:
      - main # O deploy acontece sempre que você enviar algo para a branch principal

jobs:
  # ========================================================
  # TAREFA 1: Enviar o site (Frontend) para a Hostinger
  # ========================================================
  web-deploy:
    name: Deploy FTP (Hostinger)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            node_modules/**
            atualizar-versao.js
            package-lock.json
            backend_gas/**

  # ========================================================
  # TAREFA 2: Enviar o código (Backend) para o Google
  # ========================================================
  gas-deploy:
    name: Deploy Clasp (Google Apps Script)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Setup Clasp Credentials
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Push to Google Apps Script
        run: |
          cd backend_gas
          clasp push --force
