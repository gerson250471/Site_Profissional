# Este arquivo deve ser salvo em: .github/workflows/deploy.yml

name: Deploy Fullstack (Hostinger + Google)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy FTP (Hostinger)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            node_modules/**
            atualizar-versao.js
            package-lock.json
            backend_gas/**

  gas-deploy:
    name: Deploy Clasp (Google Apps Script)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Setup e Validação da Credencial (O Detetive)
        run: |
          # 1. Cria o arquivo usando a Secret
          cat << 'EOF' > ~/.clasprc.json
          ${{ secrets.CLASP_CREDENTIALS }}
          EOF

          # 2. Mostra o tamanho do arquivo (se for muito pequeno, a Secret está vazia)
          echo "--- VERIFICAÇÃO DE ARQUIVO ---"
          ls -la ~/.clasprc.json

          # 3. Testa se o texto salvo é um JSON válido
          echo "--- TESTE DE INTEGRIDADE DO JSON ---"
          jq empty ~/.clasprc.json

      - name: Push to Google Apps Script
        run: |
          cd backend_gas
          clasp push --force
